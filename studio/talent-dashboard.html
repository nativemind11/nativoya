<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي — Nativoya Studio</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="stylesheet" href="../css/studio.css">
</head>
<body class="studio">

<header class="studio-header">
  <a href="tasks.html" style="text-decoration:none; color:inherit;"><div class="studio-logo"><span class="dot"></span> Nativoya <span class="sub">Studio</span></div></a>
  <nav>
    <span id="talent-name" style="color:var(--studio-text-muted);"></span>
    <a href="tasks.html">المهام المتاحة</a>
    <a href="#" id="logout-link" class="studio-btn studio-btn-secondary" style="padding:8px 16px;">خروج</a>
  </nav>
</header>

<main class="studio-shell wide">
  <div class="studio-eyebrow">حسابي</div>
  <h1 class="studio-title">My Tasks</h1>

  <div class="studio-card hidden" id="feedback-wrap" style="border-color:var(--studio-warn); margin-bottom:16px;"></div>

  <div class="studio-card" id="sessions-wrap">
    <p class="studio-hint">جاري التحميل...</p>
  </div>
</main>

<script src="../js/studio-talent.js"></script>
<script>
  const talent = NMTalent.requireLogin();
  if (talent) document.getElementById("talent-name").textContent = talent.name;

  document.getElementById("logout-link").addEventListener("click", (e) => {
    e.preventDefault();
    NMTalent.logout();
    location.href = "tasks.html";
  });

  const STATUS_LABELS = {
    in_progress: "لسه بتسجّل",
    submitted: "اتسلّمت — في انتظار المراجعة",
    reviewing: "بتتراجع دلوقتي",
    approved: "✅ اتقبلت",
    rejected: "❌ محتاجة إعادة",
  };
  const STATUS_CLASS = { approved: "status-approved", rejected: "status-rejected", submitted: "status-pending", reviewing: "status-pending" };

  async function loadSessions() {
    const wrap = document.getElementById("sessions-wrap");
    try {
      const sessions = await NMTalent.getMySessions();
      if (!sessions.length) {
        wrap.innerHTML = `<div class="studio-empty"><div class="icon">🎙️</div><p>لسه مسجّلتش أي حاجة. <a href="tasks.html">شوف المهام المتاحة</a> وابدأ.</p></div>`;
        return;
      }
      wrap.innerHTML = `
        <div class="studio-table-wrap">
          <table class="studio-table">
            <thead><tr><th>المهمة</th><th>الليدر</th><th>الاسم المستعار</th><th>التقدّم</th><th>الحالة</th><th></th></tr></thead>
            <tbody>
              ${sessions.map(s => `
                <tr>
                  <td>${escapeHtml(s.task_title)}</td>
                  <td><span class="studio-code">${s.leader_code}</span></td>
                  <td>${escapeHtml(s.fake_name)}</td>
                  <td>${s.recorded_count} / ${s.sample_count}</td>
                  <td>
                    <span class="studio-pill ${STATUS_CLASS[s.status] || ""}">${STATUS_LABELS[s.status] || s.status}</span>
                    ${s.status === "rejected" ? `<div class="studio-hint" style="margin-top:4px; max-width:260px;">⚠️ ${escapeHtml(s.rejection_reason || "")}</div>` : ""}
                  </td>
                  <td>
                    ${s.status === "in_progress" ? `<a href="recording.html?session=${s.session_token}" class="studio-btn studio-btn-secondary" style="padding:4px 10px; font-size:0.75rem;">كمّل</a>` : ""}
                    ${s.status === "rejected" ? `<a href="recording.html?session=${s.session_token}" class="studio-btn studio-btn-primary" style="padding:4px 10px; font-size:0.75rem;">🔁 إعادة التسجيل</a>` : ""}
                  </td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>`;
    } catch (err) {
      wrap.innerHTML = `<div class="studio-empty"><p>${err.message}</p></div>`;
    }
  }

  // Feedback the buyer sent on delivered work: exactly which recordings to redo.
  async function loadFeedback() {
    const wrap = document.getElementById("feedback-wrap");
    try {
      const { items } = await NMTalent.getMyFeedback();
      const active = items.filter(i => i.status !== "reworked");
      if (!active.length) return;
      wrap.innerHTML = `
        <h3 style="margin-top:0;">📩 فيدباك من الشركة على شغلك</h3>
        <p class="studio-hint">الشركة طلبت إعادة تسجيلات معيّنة. سجّلها تاني قبل المهلة.</p>
        ${active.map(i => {
          const t = NMTalent.timeLeft(i.rework_deadline);
          return `
          <div style="border-top:1px solid var(--studio-border); padding:12px 0; display:flex; gap:12px; justify-content:space-between; align-items:center; flex-wrap:wrap;">
            <div>
              <b>${escapeHtml(i.task_title)}</b>
              <div style="margin:6px 0;">التسجيلات المطلوبة: ${(i.recording_numbers || []).map(n => `<span class="studio-code" style="margin:0 2px;">${n}</span>`).join("")}</div>
              ${i.issue_description ? `<div class="studio-hint">المشكلة: ${escapeHtml(i.issue_description)}</div>` : ""}
              <div style="margin-top:4px; font-weight:700; color:${t.overdue ? "var(--studio-danger)" : "var(--studio-warn)"};">⏰ ${escapeHtml(t.text)}</div>
            </div>
            ${i.session_status === "rejected" ? `<a href="recording.html?session=${encodeURIComponent(i.session_token)}" class="studio-btn studio-btn-primary" style="padding:8px 16px;">🔁 إعادة التسجيل</a>` : ""}
          </div>`;
        }).join("")}`;
      wrap.classList.remove("hidden");
    } catch (_) { /* the main table below still works without this card */ }
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  if (talent) { loadSessions(); loadFeedback(); }
</script>
</body>
</html>
