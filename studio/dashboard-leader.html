<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الليدر — Nativoya Studio</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="stylesheet" href="../css/studio.css">
</head>
<body class="studio">

<header class="studio-header">
  <div class="studio-logo"><span class="dot"></span> Nativoya <span class="sub">Studio</span></div>
  <nav>
    <span id="leader-name" class="studio-text-muted" style="color:var(--studio-text-muted);"></span>
    <a href="#" id="logout-link" class="studio-btn studio-btn-secondary" style="padding:8px 16px;">خروج</a>
  </nav>
</header>

<main class="studio-shell wide">
  <div class="studio-card" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;">
    <div>
      <div class="studio-eyebrow">كود الليدر بتاعك</div>
      <div class="studio-code" style="font-size:1.3rem;" id="leader-code">—</div>
    </div>
    <p class="studio-subtitle" style="margin:0; max-width:360px;">شارك الكود ده مع أي تاسك تختار تشتغل عليه — التسليمات اللي بتوصل بيه بتتربط بيك تلقائيًا.</p>
  </div>

  <div class="studio-grid cols-3" style="margin-top:18px;">
    <div class="studio-card"><div class="studio-eyebrow">تاسكات مفتوحة ليك</div><div class="studio-title" style="font-size:1.8rem;" id="stat-open">0</div></div>
    <div class="studio-card"><div class="studio-eyebrow">تسليمات قيد المراجعة</div><div class="studio-title" style="font-size:1.8rem;" id="stat-reviewing">0</div></div>
    <div class="studio-card"><div class="studio-eyebrow">تسليمات مرفوضة</div><div class="studio-title" style="font-size:1.8rem;" id="stat-rejected">0</div></div>
  </div>

  <div class="studio-card" style="margin-top:18px;">
    <h3 style="margin-top:0;">تاسكات متاحة ليك</h3>
    <div class="studio-empty">
      <div class="icon">📋</div>
      <p>لسه مفيش تاسكات — الجزء ده بيتفعّل في المرحلة الجاية (نشر ومتابعة التاسكات).</p>
    </div>
  </div>
</main>

<script src="../js/studio-shared.js"></script>
<script>
  const user = NMStudio.requireStudioRole("leader");
  if (user) {
    document.getElementById("leader-name").textContent = user.name;
    document.getElementById("leader-code").textContent = user.leader_code;
  }
  document.getElementById("logout-link").addEventListener("click", (e) => {
    e.preventDefault();
    NMStudio.logout();
    location.href = "login.html";
  });
</script>
</body>
</html>
