<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نسيت كلمة المرور — Nativoya Studio</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="stylesheet" href="../css/studio.css">
</head>
<body class="studio">

<header class="studio-header">
  <a href="login.html" style="text-decoration:none; color:inherit;"><div class="studio-logo"><span class="dot"></span> Nativoya <span class="sub">Studio</span></div></a>
</header>

<main class="studio-shell">
  <div class="studio-card">
    <div class="studio-eyebrow">نسيت كلمة المرور</div>
    <h1 class="studio-title">استرجاع كلمة المرور</h1>
    <p class="studio-subtitle">اختار نوع حسابك واكتب إيميلك، وهنبعتلك رابط تختار بيه كلمة مرور جديدة.</p>

    <div class="studio-tabs" id="role-tabs">
      <div class="studio-tab active" data-role="talent">متسجّل</div>
      <div class="studio-tab" data-role="leader">ليدر</div>
      <div class="studio-tab" data-role="qa">QA</div>
      <div class="studio-tab" data-role="head_leader">هيد ليدر</div>
    </div>

    <form id="forgot-form">
      <div class="studio-field">
        <label for="f-email">البريد الإلكتروني</label>
        <input type="email" id="f-email" required autofocus>
      </div>
      <p class="studio-error" id="forgot-error"></p>
      <button type="submit" class="studio-btn studio-btn-primary studio-btn-block" id="forgot-btn">إرسال رابط الاسترجاع</button>
    </form>

    <div id="forgot-success" class="hidden text-center" style="padding:10px 0;">
      <div style="font-size:2.2rem;">📩</div>
      <h3 style="margin:10px 0 6px;">تحقق من إيميلك</h3>
      <p class="studio-subtitle">لو الإيميل ده مسجل عندنا، هيوصله رابط استرجاع خلال دقايق (شوف الـ Spam لو مجاش).</p>
    </div>
  </div>
</main>

<script>
  const API_BASE_URL = "https://nativoya.vercel.app";
  let selectedRole = "talent";

  document.querySelectorAll("#role-tabs .studio-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll("#role-tabs .studio-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      selectedRole = tab.dataset.role;
    });
  });

  document.getElementById("forgot-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("forgot-error");
    const btn = document.getElementById("forgot-btn");
    errorBox.style.display = "none";
    btn.disabled = true; btn.textContent = "جاري الإرسال...";
    try {
      const res = await fetch(`${API_BASE_URL}/api/studio/auth/forgot-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: document.getElementById("f-email").value.trim(), studioRole: selectedRole }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "حصل خطأ غير متوقع.");
      document.getElementById("forgot-form").classList.add("hidden");
      document.getElementById("forgot-success").classList.remove("hidden");
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
      btn.disabled = false; btn.textContent = "إرسال رابط الاسترجاع";
    }
  });
</script>
</body>
</html>
