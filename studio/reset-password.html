<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعادة تعيين كلمة المرور — Nativoya Studio</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="stylesheet" href="../css/studio.css">
</head>
<body class="studio">

<header class="studio-header">
  <a href="login.html" style="text-decoration:none; color:inherit;"><div class="studio-logo"><span class="dot"></span> Nativoya <span class="sub">Studio</span></div></a>
</header>

<main class="studio-shell">
  <div class="studio-card">
    <div class="studio-eyebrow">إعادة تعيين كلمة المرور</div>
    <h1 class="studio-title">اختار كلمة مرور جديدة</h1>

    <form id="reset-form">
      <div class="studio-field">
        <label for="r-password">كلمة المرور الجديدة</label>
        <input type="password" id="r-password" minlength="6" required>
      </div>
      <div class="studio-field">
        <label for="r-password-confirm">تأكيد كلمة المرور</label>
        <input type="password" id="r-password-confirm" minlength="6" required>
      </div>
      <p class="studio-error" id="reset-error"></p>
      <button type="submit" class="studio-btn studio-btn-primary studio-btn-block" id="reset-btn">حفظ كلمة المرور</button>
    </form>

    <div id="reset-success" class="hidden text-center" style="padding:10px 0;">
      <div style="font-size:2.2rem;">✅</div>
      <h3 style="margin:10px 0 6px;">اتغيرت كلمة المرور بنجاح</h3>
      <a href="login.html" class="studio-btn studio-btn-primary studio-btn-block">تسجيل الدخول</a>
    </div>

    <div id="reset-invalid" class="hidden text-center" style="padding:10px 0;">
      <div style="font-size:2.2rem;">⚠️</div>
      <h3 style="margin:10px 0 6px;">رابط غير صحيح أو منتهي</h3>
      <a href="forgot-password.html" class="studio-btn studio-btn-primary studio-btn-block">اطلب رابط جديد</a>
    </div>
  </div>
</main>

<script>
  const API_BASE_URL = "https://nativoya.vercel.app";
  const params = new URLSearchParams(location.search);
  const token = params.get("token");
  const role = params.get("role");

  if (!token || !role) {
    document.getElementById("reset-form").classList.add("hidden");
    document.getElementById("reset-invalid").classList.remove("hidden");
  }

  document.getElementById("reset-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("reset-error");
    const btn = document.getElementById("reset-btn");
    errorBox.style.display = "none";

    const password = document.getElementById("r-password").value;
    const confirm = document.getElementById("r-password-confirm").value;
    if (password !== confirm) {
      errorBox.textContent = "كلمتا المرور مش متطابقين.";
      errorBox.style.display = "block";
      return;
    }

    btn.disabled = true; btn.textContent = "جاري الحفظ...";
    try {
      const res = await fetch(`${API_BASE_URL}/api/studio/auth/reset-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, newPassword: password, studioRole: role }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "حصل خطأ غير متوقع.");
      document.getElementById("reset-form").classList.add("hidden");
      document.getElementById("reset-success").classList.remove("hidden");
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
      btn.disabled = false; btn.textContent = "حفظ كلمة المرور";
    }
  });
</script>
</body>
</html>
