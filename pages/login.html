<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — Nativoya</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="container section" style="max-width:420px;">
  <div class="card">
    <h1 class="text-center" style="font-size:1.6rem;">تسجيل الدخول</h1>
    <p class="text-center">أهلاً بيك تاني في Nativoya</p>
    <form id="login-form">
      <div class="field">
        <label for="l-email">البريد الإلكتروني</label>
        <input type="email" id="l-email" required>
      </div>
      <div class="field">
        <label for="l-password">كلمة المرور</label>
        <input type="password" id="l-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">دخول</button>
    </form>
    <p class="text-center" style="margin-top:16px;">
      حساب جديد؟ <a href="signup.html">سجّل الآن</a>
    </p>
    <hr style="border:none;border-top:1px solid var(--color-border);margin:18px 0;">
    <p class="text-center text-muted" style="font-size:0.82rem;">
      دخول تجريبي سريع لعرض لوحات التحكم:
    </p>
    <div class="flex gap-8" style="justify-content:center;">
      <button class="btn btn-secondary" onclick="quickLogin('member')">عضو</button>
      <button class="btn btn-secondary" onclick="quickLogin('leader')">ليدر</button>
      <button class="btn btn-secondary" onclick="quickLogin('head_leader')">هيد ليدر</button>
    </div>
  </div>
</main>

<script src="../js/shared.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", (e) => {
    e.preventDefault();
    quickLogin("member");
  });

  function quickLogin(role) {
    const user = NM.mockSignup({
      firstName: role === "head_leader" ? "أحمد طه" : role === "leader" ? "سارة عبد الله" : "محمود إبراهيم",
      email: document.getElementById("l-email").value || `${role}@demo.nativoya`,
      role,
    });
    user.role = role; // override mock default
    localStorage.setItem("nm_user", JSON.stringify(user));

    if (role === "leader") NM.joinLanguageGroup("الفرنسية", true);
    if (role === "member") NM.joinLanguageGroup("العربية (مصرية)", false);

    const target = role === "head_leader" ? "dashboard-admin.html" :
                   role === "leader" ? "dashboard-leader.html" : "dashboard-member.html";
    location.href = target;
  }
</script>
</body>
</html>
