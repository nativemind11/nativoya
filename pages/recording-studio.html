<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>استوديو التسجيل - Nativoya</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
        color: #333;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #6B4FBB 0%, #E74C8C 100%);
        color: white;
        padding: 30px;
        text-align: center;
      }

      .header h1 {
        font-size: 28px;
        margin-bottom: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .header p {
        font-size: 14px;
        opacity: 0.9;
      }

      .main-content {
        padding: 30px;
      }

      /* Script Section */
      .script-section {
        background: #f9f9f9;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 30px;
        max-height: 300px;
        overflow-y: auto;
      }

      .script-section h3 {
        color: #6B4FBB;
        margin-bottom: 15px;
        font-size: 16px;
      }

      #scriptDisplay {
        font-size: 15px;
        line-height: 1.8;
        color: #555;
      }

      #scriptDisplay p {
        margin-bottom: 10px;
      }

      /* Waveform Display */
      .waveform-section {
        margin-bottom: 30px;
      }

      .waveform-section h3 {
        color: #6B4FBB;
        margin-bottom: 15px;
        font-size: 16px;
      }

      #waveformCanvas {
        width: 100%;
        height: 150px;
        background: #f5f5f5;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        display: block;
      }

      /* Timer & Volume Display */
      .controls-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 30px;
      }

      .info-box {
        background: #f9f9f9;
        padding: 20px;
        border-radius: 8px;
        border-left: 4px solid #6B4FBB;
      }

      .info-label {
        color: #999;
        font-size: 12px;
        margin-bottom: 8px;
        text-transform: uppercase;
      }

      #timerDisplay {
        font-size: 40px;
        font-weight: bold;
        color: #E74C8C;
        font-family: "Courier New", monospace;
      }

      .volume-meter {
        height: 20px;
        background: #e0e0e0;
        border-radius: 10px;
        overflow: hidden;
        margin-top: 10px;
      }

      #volumeLevel {
        height: 100%;
        background: linear-gradient(90deg, #6B4FBB 0%, #E74C8C 100%);
        width: 30%;
        transition: width 0.1s ease;
      }

      /* Recording Controls */
      .recording-controls {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn-primary {
        background: linear-gradient(135deg, #6B4FBB 0%, #764ba2 100%);
        color: white;
      }

      .btn-primary:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(107, 79, 187, 0.3);
      }

      .btn-danger {
        background: #E74C8C;
        color: white;
      }

      .btn-danger:hover:not(:disabled) {
        background: #d43a7d;
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: #f0f0f0;
        color: #333;
        border: 1px solid #ddd;
      }

      .btn-secondary:hover:not(:disabled) {
        background: #e0e0e0;
      }

      .btn:disabled,
      .btn.disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-icon {
        background: none;
        border: none;
        font-size: 18px;
        cursor: pointer;
        padding: 8px;
        transition: transform 0.2s ease;
      }

      .btn-icon:hover {
        transform: scale(1.2);
      }

      /* Recordings List */
      .recordings-section {
        background: #f9f9f9;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 30px;
      }

      .recordings-header {
        margin-bottom: 15px;
      }

      .recordings-header h3 {
        color: #6B4FBB;
        font-size: 16px;
      }

      #recordingsList {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .recording-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: white;
        padding: 12px;
        border-radius: 6px;
        border: 1px solid #e0e0e0;
      }

      .recording-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .recording-name {
        font-weight: 600;
        color: #333;
        font-size: 14px;
      }

      .recording-duration {
        font-size: 12px;
        color: #999;
      }

      .recording-actions {
        display: flex;
        gap: 8px;
      }

      /* Settings Panel */
      .settings-section {
        background: #f9f9f9;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 30px;
      }

      .settings-section h3 {
        color: #6B4FBB;
        margin-bottom: 15px;
        font-size: 16px;
      }

      .settings-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .setting-group {
        display: flex;
        flex-direction: column;
      }

      .setting-group label {
        font-size: 12px;
        color: #666;
        margin-bottom: 8px;
        font-weight: 600;
        text-transform: uppercase;
      }

      .setting-group select {
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        background: white;
        cursor: pointer;
      }

      /* Submit Section */
      .submit-section {
        display: flex;
        gap: 10px;
        justify-content: center;
      }

      .btn-submit {
        background: linear-gradient(135deg, #6B4FBB 0%, #E74C8C 100%);
        color: white;
        padding: 14px 40px;
        font-size: 16px;
        font-weight: 700;
      }

      .btn-submit:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(107, 79, 187, 0.4);
      }

      /* Empty State */
      .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: #999;
      }

      .empty-state p {
        margin-bottom: 10px;
      }

      /* Responsive */
      @media (max-width: 600px) {
        .controls-info {
          grid-template-columns: 1fr;
        }

        .settings-grid {
          grid-template-columns: 1fr;
        }

        .recording-controls {
          gap: 8px;
        }

        .btn {
          padding: 10px 16px;
          font-size: 13px;
        }

        #timerDisplay {
          font-size: 32px;
        }
      }

      /* Recording Status Indicator */
      .recording-indicator {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px;
        background: #fff3cd;
        border: 1px solid #ffc107;
        border-radius: 20px;
        font-size: 12px;
        color: #856404;
      }

      .recording-indicator.active {
        background: #f8d7da;
        border-color: #E74C8C;
        color: #721c24;
      }

      .pulse {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #E74C8C;
        border-radius: 50%;
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(1.2);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* Loading Spinner */
      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #f3f3f3;
        border-top: 2px solid #6B4FBB;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <h1>🎙️ استوديو التسجيل</h1>
        <p id="taskTitle">جاري تحميل تفاصيل المهمة...</p>
      </div>

      <!-- Main Content -->
      <div class="main-content">
        <!-- Script Display -->
        <div class="script-section">
          <h3>📝 النص المراد تسجيله</h3>
          <div id="scriptDisplay">
            <p>جاري تحميل النص...</p>
          </div>
        </div>

        <!-- Waveform Display -->
        <div class="waveform-section">
          <h3>📊 الموجات الصوتية</h3>
          <canvas id="waveformCanvas"></canvas>
        </div>

        <!-- Timer & Volume -->
        <div class="controls-info">
          <div class="info-box">
            <div class="info-label">⏱️ الوقت المنقضي</div>
            <div id="timerDisplay">00:00</div>
          </div>
          <div class="info-box">
            <div class="info-label">🔊 مستوى الصوت</div>
            <div class="volume-meter">
              <div id="volumeLevel"></div>
            </div>
          </div>
        </div>

        <!-- Recording Controls -->
        <div class="recording-controls">
          <button id="recordBtn" class="btn btn-primary">
            🔴 ابدأ التسجيل
          </button>
          <button id="pauseBtn" class="btn btn-secondary" disabled>
            ⏸️ إيقاف مؤقت
          </button>
          <button id="stopBtn" class="btn btn-danger" disabled>
            ⏹️ إيقاف
          </button>
          <button id="noiseTestBtn" class="btn btn-secondary">
            🎯 اختبار الضوضاء
          </button>
        </div>

        <!-- Settings Panel -->
        <div class="settings-section">
          <h3>⚙️ إعدادات التسجيل</h3>
          <div class="settings-grid" id="settingsPanel">
            <div class="setting-group">
              <label for="sampleRateSelect">معدل العينة</label>
              <select id="sampleRateSelect">
                <option value="8000">8 kHz</option>
                <option value="16000">16 kHz</option>
                <option value="44100" selected>44.1 kHz</option>
                <option value="48000">48 kHz</option>
              </select>
            </div>
            <div class="setting-group">
              <label for="audioFormatSelect">صيغة الصوت</label>
              <select id="audioFormatSelect">
                <option value="wav" selected>WAV</option>
                <option value="mp3">MP3</option>
                <option value="ogg">OGG</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Recordings List -->
        <div class="recordings-section">
          <div id="recordingsList">
            <div class="empty-state">
              <p>🎤 لم تقم برفع أي تسجيلات بعد</p>
              <p>ابدأ بالضغط على زر "ابدأ التسجيل"</p>
            </div>
          </div>
        </div>

        <!-- Submit Section -->
        <div class="submit-section">
          <button id="submitBtn" class="btn btn-submit">
            ✅ إرسال التسجيلات
          </button>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="/js/shared.js"></script>
    <script src="/js/waveform.js"></script>
    <script src="/js/recording-studio.js"></script>

    <script>
      // Initialize Recording Studio
      document.addEventListener("DOMContentLoaded", async () => {
        const params = new URLSearchParams(window.location.search);
        const taskId = params.get("taskId");
        const claimId = params.get("claimId");

        if (!taskId || !claimId) {
          alert("Missing task or claim ID");
          window.location.href = "/pages/tasks.html";
          return;
        }

        // Fetch task details
        try {
          const taskResponse = await fetch(`/api/tasks/${taskId}`);
          if (!taskResponse.ok) throw new Error("Task not found");

          const task = await taskResponse.json();
          document.getElementById("taskTitle").textContent = task.title;

          // Initialize recording studio
          recordingStudio = new RecordingStudio();

          const recordingSettings = task.recording_settings || {
            sampleRate: 44100,
            audioFormat: "wav",
            bitDepth: 16,
          };

          // Fetch script URL if available
          const scriptUrl = task.instructions_script_url;

          await recordingStudio.initialize({
            sessionId: null, // Will be created on first recording
            claimId,
            taskId,
            recordingSettings,
            scriptUrl,
          });
        } catch (err) {
          console.error("Setup error:", err);
          console.log("Task ID:", taskId);
          console.log("Claim ID:", claimId);
          alert("خطأ في تحميل المهمة: " + err.message);
          // Don't redirect - stay here for debugging
        }
      });
    </script>
  </body>
</html>
