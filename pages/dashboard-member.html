<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة العضو — Nativoya</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="container section">
  <div class="dash-layout">
    <aside class="dash-sidebar">
      <span class="role-tag">عضو</span>
      <a href="dashboard-member.html" class="active">🏠 الرئيسية</a>
      <a href="my-group.html">💬 جروبي</a>
      <a href="#tasks">📋 المهام</a>
      <a href="#certs">🏆 الشهادات</a>
      <a href="#profile">👤 الملف الشخصي</a>
      <a href="#" onclick="NM.mockLogout(); location.href='login.html'; return false;">🚪 خروج</a>
    </aside>

    <div>
      <h1 id="welcome-msg" style="font-size:1.6rem;">أهلاً بيك 👋</h1>
      <p class="text-muted" id="group-info">—</p>
      <div id="leader-request-banner" class="hidden card card-compact" style="background:var(--color-pill-bg); border:none; margin-bottom:16px;">
        <p class="mb-0" style="color:var(--color-pill-text); font-weight:700;" id="leader-request-text"></p>
      </div>

      <div class="grid-3" style="margin:24px 0;">
        <div class="card card-compact text-center"><div class="num heading-font" style="font-size:1.8rem;color:var(--color-primary-blue);" id="stat-available">—</div><p class="mb-0 text-muted">مهام متاحة</p></div>
        <div class="card card-compact text-center"><div class="num heading-font" style="font-size:1.8rem;color:var(--color-primary-blue);" id="stat-completed">—</div><p class="mb-0 text-muted">مهام مكتملة</p></div>
        <div class="card card-compact text-center"><div class="num heading-font" style="font-size:1.8rem;color:var(--color-primary-blue);">3</div><p class="mb-0 text-muted">شهادات</p></div>
      </div>

      <div class="card" id="tasks">
        <h3>مهام متاحة لجروبي</h3>
        <p id="tasks-error" class="hint" style="color:#e0245e; display:none;"></p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>المهمة</th><th>المتبقي لجروبي</th><th></th></tr></thead>
            <tbody id="tasks-body"><tr><td colspan="3" class="text-muted">جاري التحميل...</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="card" id="my-submissions" style="margin-top:20px;">
        <h3>تسليماتي</h3>
        <div class="table-wrap">
          <table>
            <thead><tr><th>المهمة</th><th>الحالة</th></tr></thead>
            <tbody id="submissions-body"><tr><td colspan="2" class="text-muted">جاري التحميل...</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="card" id="certs" style="margin-top:20px;">
        <h3>شهاداتي</h3>
        <div class="grid-3" id="certs-grid"></div>
      </div>
    </div>
  </div>
</main>

<script src="../js/shared.js"></script>
<script>
  let user = NM.currentUser();
  if (!user) { location.href = "login.html"; }
  document.getElementById("welcome-msg").textContent = `أهلاً بيك يا ${user.firstName || "عضو"} 👋`;

  const STATUS_LABELS = { in_review: "بانتظار المراجعة", completed: "✅ اتقبلت" };

  async function refreshHeader() {
    try { user = await NM.apiRefreshMe(); } catch (_) {}

    // got approved as a leader since last visit — send them to the real dashboard
    if (user.role === "leader") { location.href = "dashboard-leader.html"; return; }

    document.getElementById("group-info").textContent = user.language
      ? `عضو في جروب ${user.language} — رقم #${user.groupNumber || "-"}`
      : "لسه محددتش لغتك — روح اختارها الأول";

    try {
      const request = await NM.apiMyLeaderRequest();
      const banner = document.getElementById("leader-request-banner");
      if (request && request.status === "pending") {
        banner.classList.remove("hidden");
        document.getElementById("leader-request-text").textContent =
          `⏳ طلبك تبقى ليدر جروب ${request.language} لسه قيد المراجعة من الهيد ليدر.`;
      } else if (request && request.status === "rejected") {
        banner.classList.remove("hidden");
        document.getElementById("leader-request-text").textContent =
          `طلبك تبقى ليدر جروب ${request.language} اترفض حاليًا. تقدر تكمل كعضو عادي أو تتواصل مع الهيد ليدر.`;
      }
    } catch (_) { /* no request yet — nothing to show */ }
  }

  async function loadAvailableTasks() {
    try {
      const claims = await NM.apiClaimsForMyGroup();
      document.getElementById("stat-available").textContent = claims.length;
      document.getElementById("tasks-body").innerHTML = claims.length
        ? claims.map(c => `
            <tr>
              <td>${c.title}</td>
              <td>${c.remaining_in_claim}</td>
              <td><button class="btn btn-secondary" style="padding:6px 14px;" onclick="submitWork('${c.claim_id}', this)">تسليم عمل</button></td>
            </tr>`).join("")
        : `<tr><td colspan="3" class="text-muted">مفيش مهام متاحة لجروبك دلوقتي — استنى الليدر يستلم مهام جديدة</td></tr>`;
    } catch (err) {
      document.getElementById("tasks-error").textContent = err.message;
      document.getElementById("tasks-error").style.display = "block";
    }
  }

  async function loadMySubmissions() {
    try {
      const submissions = await NM.apiMySubmissions();
      document.getElementById("stat-completed").textContent =
        submissions.filter(s => s.status === "completed").length;
      document.getElementById("submissions-body").innerHTML = submissions.length
        ? submissions.map(s => `
            <tr><td>${s.task_title}</td><td><span class="pill ${s.status === "completed" ? "badge-success" : "badge-pending"}">${STATUS_LABELS[s.status] || s.status}</span></td></tr>
          `).join("")
        : `<tr><td colspan="2" class="text-muted">لسه ماسلمتش أي شغل</td></tr>`;
    } catch (err) { /* non-critical */ }
  }

  // Drive upload isn't wired up yet, so for now the member pastes a link to
  // the file (Google Drive / WeTransfer / etc.) — this will be replaced by a
  // real upload-to-Drive flow once that integration is built.
  async function submitWork(claimId, btn) {
    const fileUrl = prompt("حط رابط الملف (Google Drive أو أي رابط تاني):");
    if (!fileUrl) return;
    btn.disabled = true;
    try {
      await NM.apiSubmitFile(claimId, fileUrl);
      await Promise.all([loadAvailableTasks(), loadMySubmissions()]);
    } catch (err) {
      alert(err.message);
      btn.disabled = false;
    }
  }

  refreshHeader();
  loadAvailableTasks();
  loadMySubmissions();

  const certs = ["تفريغ صوتي", "ترجمة", "توسيم بيانات"];
  const certsGrid = document.getElementById("certs-grid");
  certs.forEach(c => {
    certsGrid.innerHTML += `
      <div class="card card-compact text-center">
        <div style="font-size:1.6rem;">🏆</div>
        <p class="mb-0" style="font-weight:700;">${c}</p>
        <p class="text-muted" style="font-size:0.78rem;">شهادة إتمام</p>
      </div>`;
  });
</script>
</body>
</html>
