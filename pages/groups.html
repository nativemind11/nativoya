<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الجروبات — Nativoya</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="container section" id="groups-page-main">
  <div class="section-head">
    <h1>كل الجروبات — إدارة الهيد ليدر</h1>
    <p>عرض ومراقبة كل جروبات اللغات وشاتاتها. الصفحة دي متاحة لحسابات الهيد ليدر فقط.</p>
  </div>

  <div class="chat-shell card" style="padding:0;" id="chat-shell">
    <aside class="chat-groups" id="groups-list"></aside>
    <section class="chat-main">
      <div class="chat-head" id="chat-head" style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
        <span id="chat-head-title">اختر جروب</span>
        <button type="button" class="btn btn-secondary hidden" id="lock-toggle-btn" style="padding:6px 14px; font-size:0.8rem; white-space:nowrap;"></button>
      </div>
      <div id="chat-locked-banner" class="hidden" style="padding:8px 18px; background:#FFF4E5; color:#8a5a00; font-size:0.82rem; border-bottom:1px solid var(--color-border);">
        🔒 الشات مقفول دلوقتي — الأعضاء والليدرز مش هيقدروا يبعتوا رسايل.
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="اكتب رسالتك...">
        <button class="btn btn-secondary" id="mic-btn" title="رسالة صوتية">🎤</button>
        <button class="btn btn-secondary" id="attach-btn" title="إرفاق ملف">📎</button>
        <button class="btn btn-primary" id="send-btn">إرسال</button>
      </div>
    </section>
  </div>

  <p class="text-muted text-center" style="margin-top:16px; font-size:0.85rem;">
    💬 شات حقيقي متصل بـ Firebase — بتقدر تراقب وتبعت في أي جروب مباشرة.
  </p>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/shared.js"></script>
<script src="../js/chat.js"></script>
<script>
  // Access guard: this master group-monitoring view is head_leader-only.
  const currentUser = NM.currentUser();
  if (!currentUser || currentUser.role !== "head_leader") {
    document.getElementById("groups-page-main").innerHTML = `
      <div class="card text-center" style="max-width:480px; margin:40px auto;">
        <div style="font-size:2rem;">🔒</div>
        <h2 style="font-size:1.3rem;">الوصول مقصور على الهيد ليدر</h2>
        <p class="text-muted">صفحة إدارة ومراقبة كل الجروبات متاحة فقط لحسابات الهيد ليدر.
        لو انت عضو أو ليدر، جروبك الخاص موجود في <a href="my-group.html">صفحة جروبي</a>.</p>
        <a href="login.html" class="btn btn-primary btn-block">تسجيل الدخول</a>
      </div>`;
  } else {
    initGroupsPage();
  }

  let activeGroup = null;
  let unsubscribe = null;
  let lockUnsubscribe = null;
  let isGroupCurrentlyLocked = false;

  async function initGroupsPage() {
    const listEl = document.getElementById("groups-list");
    try {
      const groups = await NM.apiGetGroups();
      if (!groups.length) {
        listEl.innerHTML = `<p class="text-muted" style="padding:16px;">مفيش جروبات لسه</p>`;
        return;
      }
      listEl.innerHTML = "";
      groups.forEach(g => {
        const div = document.createElement("div");
        div.className = "group-item";
        div.dataset.id = g.id;
        div.innerHTML = `
          <div class="avatar">${g.language[0]}</div>
          <div>
            <div style="font-weight:700; font-size:0.9rem;">${g.language} — جروب #${g.group_number}</div>
            <div class="text-muted" style="font-size:0.78rem;">${g.leader_name || "بدون ليدر"} · ${g.member_count} عضو</div>
          </div>`;
        div.addEventListener("click", () => openGroup(g));
        listEl.appendChild(div);
      });
      openGroup(groups[0]);
    } catch (err) {
      listEl.innerHTML = `<p class="text-muted" style="padding:16px; color:#e0245e;">${err.message}</p>`;
    }
  }

  async function openGroup(g) {
    activeGroup = g;
    document.querySelectorAll(".group-item").forEach(el => el.classList.toggle("active", el.dataset.id === g.id));
    document.getElementById("chat-head-title").textContent = `${g.language} — جروب #${g.group_number}`;
    document.getElementById("lock-toggle-btn").classList.remove("hidden");

    const wrap = document.getElementById("chat-messages");
    wrap.innerHTML = `<p class="text-muted" style="padding:16px;">جاري تحميل الرسايل...</p>`;
    if (unsubscribe) unsubscribe();
    if (lockUnsubscribe) lockUnsubscribe();

    try {
      await NMChat.ensureFirebaseAuth();
      unsubscribe = NMChat.listenToGroup(g.id, renderMessages, (err) => {
        wrap.innerHTML = `<p class="text-muted" style="padding:16px;">تعذر تحميل الرسايل: ${err.message}</p>`;
      });
      lockUnsubscribe = NMChat.listenToGroupLock(g.id, updateLockUi);
    } catch (err) {
      wrap.innerHTML = `<p class="text-muted" style="padding:16px;">تعذر الاتصال بالشات: ${err.message}</p>`;
    }
  }

  function updateLockUi(locked) {
    isGroupCurrentlyLocked = locked;
    const btn = document.getElementById("lock-toggle-btn");
    btn.textContent = locked ? "🔓 فتح الشات" : "🔒 قفل الشات";
    document.getElementById("chat-locked-banner").classList.toggle("hidden", !locked);
  }

  document.getElementById("lock-toggle-btn").addEventListener("click", async () => {
    if (!activeGroup) return;
    const nextLocked = !isGroupCurrentlyLocked;
    const confirmMsg = nextLocked
      ? "متأكد إنك عايز تقفل الشات؟ الأعضاء والليدرز مش هيقدروا يبعتوا رسايل لحد ما تفتحه تاني."
      : "متأكد إنك عايز تفتح الشات تاني؟";
    if (!confirm(confirmMsg)) return;
    const btn = document.getElementById("lock-toggle-btn");
    btn.disabled = true;
    try {
      await NMChat.setGroupLocked(activeGroup.id, nextLocked);
    } catch (err) {
      alert(err.message);
    } finally {
      btn.disabled = false;
    }
  });

  const REACTION_EMOJIS = ["👍", "❤️", "😂", "😮", "😢", "🙏"];
  let lastMessages = [];

  function renderMessages(messages) {
    lastMessages = messages;
    const wrap = document.getElementById("chat-messages");
    const myUid = NMChat.currentUid();
    wrap.innerHTML = messages.length
      ? messages.map(m => renderMessageRow(m, myUid)).join("")
      : `<p class="text-muted" style="padding:16px;">لسه مفيش رسايل في الجروب ده</p>`;
    wrap.scrollTop = wrap.scrollHeight;
  }

  function renderMessageRow(m, myUid) {
    const isMine = m.senderId === myUid;
    return `
      <div class="msg-row${isMine ? " mine" : ""}" data-mid="${m.id}">
        <div class="msg-avatar">${(m.senderName || "?")[0]}</div>
        <div class="msg-col">
          <div class="msg-bubble">
            ${renderMessageBody(m)}
            ${m.editedAt ? `<span class="msg-edited-tag">(معدّلة)</span>` : ""}
          </div>
          <div class="msg-meta-row">
            <div class="msg-reactions">${renderReactions(m, myUid)}</div>
            <div class="msg-actions">
              <button type="button" class="msg-action-btn" data-action="react-toggle" data-mid="${m.id}" title="رياكت">😊</button>
              ${isMine && m.type === "text" ? `<button type="button" class="msg-action-btn" data-action="edit" data-mid="${m.id}" title="تعديل">✏️</button>` : ""}
              <button type="button" class="msg-action-btn" data-action="delete" data-mid="${m.id}" title="حذف">🗑️</button>
            </div>
          </div>
          <div class="msg-emoji-picker hidden" data-picker-for="${m.id}">
            ${REACTION_EMOJIS.map(e => `<button type="button" class="msg-emoji-opt" data-action="react" data-mid="${m.id}" data-emoji="${e}">${e}</button>`).join("")}
          </div>
        </div>
      </div>`;
  }

  function renderReactions(m, myUid) {
    const reactions = m.reactions || {};
    const counts = {};
    let mine = null;
    Object.entries(reactions).forEach(([uid, emoji]) => {
      counts[emoji] = (counts[emoji] || 0) + 1;
      if (uid === myUid) mine = emoji;
    });
    return Object.entries(counts).map(([emoji, count]) => `
      <span class="reaction-pill${emoji === mine ? " mine" : ""}" data-action="react" data-mid="${m.id}" data-emoji="${emoji}">${emoji} ${count}</span>
    `).join("");
  }

  function renderMessageBody(m) {
    if (m.type === "audio" && m.audioData) {
      return `<audio controls style="max-width:220px;" src="data:${m.mimeType};base64,${m.audioData}"></audio>`;
    }
    return escapeHtml(m.text || "");
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  function escapeAttr(s) {
    return String(s || "").replace(/"/g, "&quot;");
  }

  function startEdit(mid) {
    const m = lastMessages.find(x => x.id === mid);
    if (!m) return;
    document.querySelectorAll(".msg-emoji-picker").forEach(p => p.classList.add("hidden"));
    const bubble = document.querySelector(`.msg-row[data-mid="${mid}"] .msg-bubble`);
    if (!bubble) return;
    bubble.innerHTML = `
      <input type="text" class="edit-input" value="${escapeAttr(m.text || "")}">
      <div class="edit-actions">
        <button type="button" class="btn btn-primary" style="padding:4px 10px; font-size:0.8rem;" data-action="save-edit" data-mid="${mid}">حفظ</button>
        <button type="button" class="btn btn-secondary" style="padding:4px 10px; font-size:0.8rem;" data-action="cancel-edit" data-mid="${mid}">إلغاء</button>
      </div>`;
    const input = bubble.querySelector(".edit-input");
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") saveEdit(mid, input.value);
      if (e.key === "Escape") renderMessages(lastMessages);
    });
  }

  async function saveEdit(mid, newText) {
    newText = newText.trim();
    if (!newText || !activeGroup) { renderMessages(lastMessages); return; }
    try {
      await NMChat.editMessage(activeGroup.id, mid, newText);
    } catch (err) {
      alert(err.message);
      renderMessages(lastMessages);
    }
  }

  // One delegated listener handles every message's buttons, even after the
  // list is fully re-rendered on every realtime update (it's attached to the
  // container, not to the buttons themselves).
  document.getElementById("chat-messages").addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn || !activeGroup) return;
    const action = btn.dataset.action;
    const mid = btn.dataset.mid;

    if (action === "react-toggle") {
      const picker = document.querySelector(`.msg-emoji-picker[data-picker-for="${mid}"]`);
      const wasOpen = picker && !picker.classList.contains("hidden");
      document.querySelectorAll(".msg-emoji-picker").forEach(p => p.classList.add("hidden"));
      if (picker && !wasOpen) picker.classList.remove("hidden");
      return;
    }
    if (action === "react") {
      const emoji = btn.dataset.emoji;
      const m = lastMessages.find(x => x.id === mid);
      const myUid = NMChat.currentUid();
      const current = m && m.reactions ? m.reactions[myUid] : null;
      document.querySelectorAll(".msg-emoji-picker").forEach(p => p.classList.add("hidden"));
      try { await NMChat.toggleReaction(activeGroup.id, mid, emoji, current); }
      catch (err) { alert(err.message); }
      return;
    }
    if (action === "edit") { startEdit(mid); return; }
    if (action === "cancel-edit") { renderMessages(lastMessages); return; }
    if (action === "save-edit") {
      const input = document.querySelector(`.msg-row[data-mid="${mid}"] .edit-input`);
      if (input) saveEdit(mid, input.value);
      return;
    }
    if (action === "delete") {
      if (!confirm("متأكد إنك عايز تمسح الرسالة دي؟")) return;
      try { await NMChat.deleteMessage(activeGroup.id, mid); }
      catch (err) { alert(err.message); }
      return;
    }
  });

  document.getElementById("send-btn").addEventListener("click", sendMsg);
  document.getElementById("chat-input").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMsg(); });
  function sendMsg() {
    if (!activeGroup) { alert("اختر جروب الأول"); return; }
    const input = document.getElementById("chat-input");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    NMChat.sendMessage(activeGroup.id, text, "الهيد ليدر").catch(err => alert(err.message));
  }

  document.getElementById("attach-btn").addEventListener("click", () => {
    alert("رفع الملفات في الشات هيتفعّل قريب.");
  });

  // --- voice messages ---
  let activeRecording = null;
  const micBtn = document.getElementById("mic-btn");
  micBtn.addEventListener("click", async () => {
    if (!activeGroup) { alert("اختر جروب الأول"); return; }
    if (activeRecording) { activeRecording.stop(); return; }
    try {
      activeRecording = await NMChat.startVoiceRecording(60);
      micBtn.textContent = "⏹";
      micBtn.classList.add("btn-primary");
      micBtn.classList.remove("btn-secondary");
      const { base64, mimeType } = await activeRecording.result;
      await NMChat.sendVoiceMessage(activeGroup.id, base64, mimeType, "الهيد ليدر");
    } catch (err) {
      alert(err.message);
    } finally {
      activeRecording = null;
      micBtn.textContent = "🎤";
      micBtn.classList.remove("btn-primary");
      micBtn.classList.add("btn-secondary");
    }
  });
</script>
</body>
</html>
