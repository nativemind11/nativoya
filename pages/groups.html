<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الجروبات — Nativoya</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="container section" id="groups-page-main">
  <div class="section-head">
    <h1>كل الجروبات — إدارة الهيد ليدر</h1>
    <p>عرض ومراقبة كل جروبات اللغات وشاتاتها. الصفحة دي متاحة لحسابات الهيد ليدر فقط.</p>
  </div>

  <div class="chat-shell card" style="padding:0;" id="chat-shell">
    <aside class="chat-groups" id="groups-list"></aside>
    <section class="chat-main">
      <div class="chat-head" id="chat-head">اختر جروب</div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="اكتب رسالتك...">
        <button class="btn btn-secondary" id="attach-btn" title="إرفاق ملف">📎</button>
        <button class="btn btn-primary" id="send-btn">إرسال</button>
      </div>
    </section>
  </div>

  <p class="text-muted text-center" style="margin-top:16px; font-size:0.85rem;">
    💬 ده عرض توضيحي (Demo) للواجهة — الشات الفعلي هيتوصل بـ Firebase Firestore للرسائل الحقيقية بين الأعضاء.
  </p>
</main>

<script src="../js/shared.js"></script>
<script>
  // Access guard: this master group-monitoring view is head_leader-only.
  const currentUser = NM.currentUser();
  if (!currentUser || currentUser.role !== "head_leader") {
    document.getElementById("groups-page-main").innerHTML = `
      <div class="card text-center" style="max-width:480px; margin:40px auto;">
        <div style="font-size:2rem;">🔒</div>
        <h2 style="font-size:1.3rem;">الوصول مقصور على الهيد ليدر</h2>
        <p class="text-muted">صفحة إدارة ومراقبة كل الجروبات متاحة فقط لحسابات الهيد ليدر.
        لو انت عضو أو ليدر، جروبك الخاص موجود في <a href="my-group.html">صفحة جروبي</a>.</p>
        <a href="login.html" class="btn btn-primary btn-block">تسجيل الدخول</a>
      </div>`;
  } else {
    initGroupsPage();
  }

  function initGroupsPage() {
  const GROUPS = [
    { id: 1, lang: "العربية (مصرية)", num: 12, members: 48 },
    { id: 2, lang: "الفرنسية", num: 7, members: 22 },
    { id: 3, lang: "الإسبانية", num: 3, members: 15 },
    { id: 4, lang: "الإنجليزية", num: 19, members: 61 },
    { id: 5, lang: "الألمانية", num: 4, members: 9 },
  ];

  const MOCK_MESSAGES = {
    1: [
      { me: false, name: "سارة", text: "صباح الخير يا جماعة! فيه مهمة تفريغ صوتي جديدة النهاردة" },
      { me: false, name: "كريم", text: "تمام، هبدأ فيها دلوقتي" },
      { me: true, name: "أنا", text: "تمام يا فندم، وصلتني" },
    ],
    2: [
      { me: false, name: "Marie", text: "Bonjour tout le monde 👋" },
      { me: true, name: "أنا", text: "Salut! Une nouvelle tâche est disponible" },
    ],
    3: [{ me: false, name: "Carlos", text: "¿Alguien probó la nueva tarea de subtitulado?" }],
    4: [{ me: false, name: "John", text: "New transcription batch just dropped, check the group tasks tab." }],
    5: [{ me: false, name: "Klaus", text: "Willkommen in der Gruppe!" }],
  };

  const listEl = document.getElementById("groups-list");
  GROUPS.forEach(g => {
    const div = document.createElement("div");
    div.className = "group-item";
    div.dataset.id = g.id;
    div.innerHTML = `
      <div class="avatar">${g.lang[0]}</div>
      <div>
        <div style="font-weight:700; font-size:0.9rem;">${g.lang} — جروب #${g.num}</div>
        <div class="text-muted" style="font-size:0.78rem;">${g.members} عضو</div>
      </div>`;
    div.addEventListener("click", () => openGroup(g));
    listEl.appendChild(div);
  });

  let activeGroup = null;
  function openGroup(g) {
    activeGroup = g;
    document.querySelectorAll(".group-item").forEach(el => el.classList.toggle("active", +el.dataset.id === g.id));
    document.getElementById("chat-head").textContent = `${g.lang} — جروب #${g.num}`;
    renderMessages();
  }

  function renderMessages() {
    const wrap = document.getElementById("chat-messages");
    wrap.innerHTML = "";
    (MOCK_MESSAGES[activeGroup.id] || []).forEach(m => addBubble(m));
    wrap.scrollTop = wrap.scrollHeight;
  }

  function addBubble(m) {
    const wrap = document.getElementById("chat-messages");
    const row = document.createElement("div");
    row.className = "msg-row" + (m.me ? " mine" : "");
    row.innerHTML = `
      <div class="msg-avatar">${m.name[0]}</div>
      <div>
        <div class="msg-bubble">${m.text}</div>
      </div>`;
    wrap.appendChild(row);
    wrap.scrollTop = wrap.scrollHeight;
  }

  document.getElementById("send-btn").addEventListener("click", sendMsg);
  document.getElementById("chat-input").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMsg(); });
  function sendMsg() {
    if (!activeGroup) { alert("اختر جروب الأول"); return; }
    const input = document.getElementById("chat-input");
    if (!input.value.trim()) return;
    const msg = { me: true, name: "أنا", text: input.value.trim() };
    MOCK_MESSAGES[activeGroup.id] = MOCK_MESSAGES[activeGroup.id] || [];
    MOCK_MESSAGES[activeGroup.id].push(msg);
    addBubble(msg);
    input.value = "";
  }

  document.getElementById("attach-btn").addEventListener("click", () => {
    alert("رفع الملفات والصور هيتفعّل بعد ربط Firebase Storage بالكامل.");
  });

  // open first group by default
  openGroup(GROUPS[0]);
  }
</script>
</body>
</html>
