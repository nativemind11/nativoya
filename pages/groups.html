<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الجروبات — Nativoya</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="container section" id="groups-page-main">
  <div class="section-head">
    <h1>كل الجروبات — إدارة الهيد ليدر</h1>
    <p>عرض ومراقبة كل جروبات اللغات وشاتاتها. الصفحة دي متاحة لحسابات الهيد ليدر فقط.</p>
  </div>

  <div class="chat-shell card" style="padding:0;" id="chat-shell">
    <aside class="chat-groups" id="groups-list"></aside>
    <section class="chat-main">
      <div class="chat-head" id="chat-head">اختر جروب</div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="اكتب رسالتك...">
        <button class="btn btn-secondary" id="attach-btn" title="إرفاق ملف">📎</button>
        <button class="btn btn-primary" id="send-btn">إرسال</button>
      </div>
    </section>
  </div>


</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/shared.js"></script>
<script>
  // Access guard: this master group-monitoring view is head_leader-only.
  const currentUser = NM.currentUser();
  if (!currentUser || currentUser.role !== "head_leader") {
    document.getElementById("groups-page-main").innerHTML = `
      <div class="card text-center" style="max-width:480px; margin:40px auto;">
        <div style="font-size:2rem;">🔒</div>
        <h2 style="font-size:1.3rem;">الوصول مقصور على الهيد ليدر</h2>
        <p class="text-muted">صفحة إدارة ومراقبة كل الجروبات متاحة فقط لحسابات الهيد ليدر.
        لو انت عضو أو ليدر، جروبك الخاص موجود في <a href="my-group.html">صفحة جروبي</a>.</p>
        <a href="login.html" class="btn btn-primary btn-block">تسجيل الدخول</a>
      </div>`;
  } else {
    initGroupsPage();
  }

  let firestoreUnsub = null;

  async function initGroupsPage() {
    await NM_FIREBASE.ready; // anonymous auth must succeed before touching Firestore
    let groups = [];
    try {
      groups = await NM.apiGetGroups(); // real data from Postgres via the backend
    } catch (err) {
      document.getElementById("groups-list").innerHTML = `<p class="text-muted" style="padding:12px;">تعذر تحميل الجروبات: ${err.message}</p>`;
      return;
    }

    const listEl = document.getElementById("groups-list");
    if (groups.length === 0) {
      listEl.innerHTML = `<p class="text-muted" style="padding:12px;">لسه مفيش جروبات اتعملت.</p>`;
      return;
    }

    groups.forEach(g => {
      const div = document.createElement("div");
      div.className = "group-item";
      div.dataset.id = g.id;
      div.innerHTML = `
        <div class="avatar">${g.language[0]}</div>
        <div>
          <div style="font-weight:700; font-size:0.9rem;">${g.language} — جروب #${g.group_number}</div>
          <div class="text-muted" style="font-size:0.78rem;">${g.member_count} عضو${g.leader_name ? " · ليدر: " + g.leader_name : ""}</div>
        </div>`;
      div.addEventListener("click", () => openGroup(g));
      listEl.appendChild(div);
    });

    openGroup(groups[0]);
  }

  function openGroup(g) {
    document.querySelectorAll(".group-item").forEach(el => el.classList.toggle("active", +el.dataset.id === g.id));
    document.getElementById("chat-head").textContent = `${g.language} — جروب #${g.group_number}`;

    if (firestoreUnsub) firestoreUnsub(); // stop listening to the previous group's chat

    const chatId = `${g.language}_${g.group_number}`.replace(/[^\w\u0600-\u06FF]/g, "_");
    const messagesRef = NM_FIREBASE.db.collection("groupChats").doc(chatId).collection("messages");
    firestoreUnsub = messagesRef.orderBy("createdAt", "asc").limit(200).onSnapshot(snapshot => {
      const wrap = document.getElementById("chat-messages");
      wrap.innerHTML = "";
      snapshot.forEach(doc => {
        const m = doc.data();
        const mine = m.userId === currentUser.id;
        const row = document.createElement("div");
        row.className = "msg-row" + (mine ? " mine" : "");
        row.innerHTML = `
          <div class="msg-avatar">${(m.name || "?")[0]}</div>
          <div><div class="msg-bubble">${m.text}</div></div>`;
        wrap.appendChild(row);
      });
      wrap.scrollTop = wrap.scrollHeight;
    }, (err) => console.error("Firestore chat error:", err));

    document.getElementById("send-btn").onclick = () => sendMsg(messagesRef);
    document.getElementById("chat-input").onkeydown = (e) => { if (e.key === "Enter") sendMsg(messagesRef); };
  }

  function sendMsg(messagesRef) {
    const input = document.getElementById("chat-input");
    const text = input.value.trim();
    if (!text) return;
    messagesRef.add({
      text,
      name: currentUser.firstName || "الهيد ليدر",
      userId: currentUser.id,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    input.value = "";
  }

  document.getElementById("attach-btn").addEventListener("click", () => {
    alert("رفع الملفات والصور هيتفعّل بعد ترقية Firebase Storage.");
  });
</script>
</body>
</html>
