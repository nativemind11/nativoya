<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعادة تعيين كلمة المرور — Nativoya</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="container section" style="max-width:420px;">
  <div class="card" id="reset-card">
    <div class="text-center" style="margin-bottom:6px;">
      <div style="font-size:2.2rem; line-height:1;">🔒</div>
    </div>
    <h1 class="text-center" style="font-size:1.5rem;">اختار كلمة مرور جديدة</h1>
    <p class="text-center text-muted" style="font-size:0.9rem;">اكتب كلمة مرور جديدة وقوية لحسابك على Nativoya.</p>

    <form id="reset-form">
      <div class="field">
        <label for="r-password">كلمة المرور الجديدة</label>
        <input type="password" id="r-password" minlength="6" required>
      </div>
      <div class="field">
        <label for="r-password-confirm">تأكيد كلمة المرور</label>
        <input type="password" id="r-password-confirm" minlength="6" required>
      </div>
      <p id="reset-error" class="hint" style="color:#e0245e; display:none;"></p>
      <button type="submit" class="btn btn-primary btn-block" id="reset-submit">حفظ كلمة المرور</button>
    </form>

    <div id="reset-success" class="hidden text-center" style="padding:8px 0;">
      <div style="font-size:2.4rem;">✅</div>
      <h2 style="font-size:1.15rem; margin-bottom:6px;">اتغيرت كلمة المرور بنجاح</h2>
      <p class="text-muted" style="font-size:0.9rem; margin-bottom:16px;">تقدر تدخل بكلمة المرور الجديدة دلوقتي.</p>
      <a href="login.html" class="btn btn-primary btn-block">تسجيل الدخول</a>
    </div>

    <div id="reset-invalid" class="hidden text-center" style="padding:8px 0;">
      <div style="font-size:2.4rem;">⚠️</div>
      <h2 style="font-size:1.15rem; margin-bottom:6px;">رابط غير صحيح أو منتهي</h2>
      <p class="text-muted" style="font-size:0.9rem; margin-bottom:16px;">
        رابط الاسترجاع ده مبقاش شغال. اطلب رابط جديد وحاول تاني.
      </p>
      <a href="forgot-password.html" class="btn btn-primary btn-block">اطلب رابط جديد</a>
    </div>
  </div>
</main>

<script src="../js/shared.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const token = params.get("token");

  if (!token) {
    document.getElementById("reset-form").classList.add("hidden");
    document.getElementById("reset-invalid").classList.remove("hidden");
  }

  document.getElementById("reset-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("reset-error");
    const submitBtn = document.getElementById("reset-submit");
    errorBox.style.display = "none";

    const password = document.getElementById("r-password").value;
    const confirm = document.getElementById("r-password-confirm").value;
    if (password !== confirm) {
      errorBox.textContent = "كلمتا المرور مش متطابقين.";
      errorBox.style.display = "block";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "جاري الحفظ...";
    try {
      await NM.apiResetPassword(token, password);
      document.getElementById("reset-form").classList.add("hidden");
      document.getElementById("reset-success").classList.remove("hidden");
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "حفظ كلمة المرور";
    }
  });
</script>
</body>
</html>
