<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نسيت كلمة المرور — Nativoya</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="container section" style="max-width:420px;">
  <div class="card">
    <div class="text-center" style="margin-bottom:6px;">
      <div style="font-size:2.2rem; line-height:1;">🔑</div>
    </div>
    <h1 class="text-center" style="font-size:1.5rem;">نسيت كلمة المرور؟</h1>
    <p class="text-center text-muted" style="font-size:0.9rem;">
      محدش بينسى إنه إنسان 🙂 اكتب إيميلك وهنبعتلك رابط تختار بيه كلمة مرور جديدة.
    </p>

    <form id="forgot-form">
      <div class="field">
        <label for="f-email">البريد الإلكتروني</label>
        <input type="email" id="f-email" required autofocus>
      </div>
      <p id="forgot-error" class="hint" style="color:#e0245e; display:none;"></p>
      <button type="submit" class="btn btn-primary btn-block" id="forgot-submit">إرسال رابط الاسترجاع</button>
    </form>

    <div id="forgot-success" class="hidden" style="text-align:center; padding:8px 0;">
      <div style="font-size:2.4rem;">📩</div>
      <h2 style="font-size:1.15rem; margin-bottom:6px;">تحقق من إيميلك</h2>
      <p class="text-muted" style="font-size:0.9rem;">
        لو الإيميل ده مسجل عندنا، هيوصله رابط استرجاع كلمة المرور خلال دقايق (متنساش تشوف الـ Spam / غير هام).
      </p>
    </div>

    <p class="text-center" style="margin-top:18px;">
      <a href="login.html">رجوع لتسجيل الدخول</a>
    </p>
  </div>
</main>

<script src="../js/shared.js"></script>
<script>
  document.getElementById("forgot-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("forgot-error");
    const submitBtn = document.getElementById("forgot-submit");
    errorBox.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "جاري الإرسال...";

    try {
      await NM.apiForgotPassword(document.getElementById("f-email").value.trim());
      document.getElementById("forgot-form").classList.add("hidden");
      document.getElementById("forgot-success").classList.remove("hidden");
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "إرسال رابط الاسترجاع";
    }
  });
</script>
</body>
</html>
