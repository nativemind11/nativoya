<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">تفاصيل المهمة — Nativoya</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="container section" id="page-main" style="max-width:720px;">
  <a href="#" id="back-link" class="text-muted" style="display:inline-block; margin-bottom:16px;">→ رجوع للوحة التحكم</a>

  <div id="task-loading" class="card text-center">
    <p class="text-muted mb-0">جاري تحميل تفاصيل المهمة...</p>
  </div>

  <div id="task-content" class="hidden">
    <span class="pill" id="task-skill-pill">—</span>
    <h1 id="task-title" style="margin-top:14px;">—</h1>

    <div class="card" style="margin-top:16px;" id="task-video-card">
      <h3>🎬 فيديو الشرح</h3>
      <div id="task-video-wrap" style="display:grid; gap:10px;"></div>
    </div>

    <div class="card" style="margin-top:16px;" id="task-audio-card">
      <h3>🔊 سامبل صوتي</h3>
      <div id="task-audio-wrap" style="display:grid; gap:10px;"></div>
    </div>

    <div class="card" style="margin-top:16px;">
      <h3>📋 التعليمات</h3>
      <p id="task-instructions" class="mb-0" style="white-space:pre-wrap;">—</p>
    </div>

    <div class="grid-2" style="margin-top:16px; align-items:stretch;">
      <div class="card card-compact text-center">
        <div class="text-muted" style="font-size:0.85rem;">السعر</div>
        <div class="heading-font" style="font-size:1.6rem; color:var(--color-primary-blue);" id="task-price">—</div>
      </div>
      <div class="card card-compact text-center">
        <div class="text-muted" style="font-size:0.85rem;">المتبقي على المنصة</div>
        <div class="heading-font" style="font-size:1.6rem; color:var(--color-primary-blue);" id="task-remaining">—</div>
      </div>
    </div>

    <div class="card" style="margin-top:16px;" id="submit-card">
      <h3>📎 تسليم شغلك على المهمة دي</h3>
      <p class="text-muted" id="submit-hint">لو جروبك استلم كمية من المهمة دي، هتقدر ترفع شغلك من هنا.</p>
      <p id="naming-notice" class="card card-compact hidden" style="background:var(--color-pill-bg); border:none; font-size:0.85rem; color:var(--color-pill-text); font-weight:600;"></p>
      <p id="submit-error" class="hint" style="color:#e0245e; display:none;"></p>
      <p id="submit-success" class="hint" style="color:#16a34a; display:none; font-weight:700;"></p>
      <input type="file" id="submit-file" class="hidden">
      <button class="btn btn-primary" id="submit-btn" onclick="document.getElementById('submit-file').click()">📎 رفع الشغل</button>
    </div>
  </div>

  <div id="task-error" class="card text-center hidden">
    <p class="text-muted mb-0" id="task-error-text">تعذّر تحميل المهمة.</p>
  </div>
</main>

<script src="../js/shared.js"></script>
<script>
  let user = NM.currentUser();
  if (!user) { location.href = "login.html"; }

  const taskId = new URLSearchParams(location.search).get("id");
  if (!taskId) { location.href = "dashboard-member.html"; }

  let matchingClaim = null;

  async function loadTask() {
    try {
      user = await NM.apiRefreshMe(); // make sure role + whatsapp are fresh, not a stale cached copy
    } catch (_) { /* fall back to the cached copy if this fails */ }

    document.getElementById("back-link").href = user.role === "head_leader" ? "dashboard-admin.html"
      : user.role === "leader" ? "dashboard-leader.html" : "dashboard-member.html";

    try {
      const task = await NM.apiGetTask(taskId);
      document.getElementById("page-title").textContent = `${task.title} — Nativoya`;
      document.getElementById("task-skill-pill").textContent = `${task.skill_icon || "🧩"} ${task.skill_name_ar || task.skill_slug}`;
      document.getElementById("task-title").textContent = task.title;
      document.getElementById("task-instructions").textContent = task.instructions || "لا توجد تعليمات إضافية.";
      document.getElementById("task-remaining").textContent = task.remaining ?? "—";
      document.getElementById("task-price").textContent = task.price
        ? `${Number(task.price).toLocaleString("ar-EG")} ${task.currency || "USD"}`
        : "غير محدد";

      // video(s): just a clean "open video" link — embedding iframes has
      // been unreliable across browsers/networks, so we link out instead
      const videoWrap = document.getElementById("task-video-wrap");
      const videoUrls = task.video_urls || [];
      if (videoUrls.length) {
        videoWrap.innerHTML = videoUrls.map((url, i) => `
          <a href="${url}" target="_blank" rel="noopener" class="btn btn-secondary" style="display:inline-flex; align-items:center; gap:8px; width:fit-content;">
            ▶️ ${videoUrls.length > 1 ? `فيديو ${i + 1}` : "افتح الفيديو"}
          </a>`).join("");
      } else {
        document.getElementById("task-video-card").classList.add("hidden");
      }

      const audioWrap = document.getElementById("task-audio-wrap");
      const audioUrls = task.audio_sample_urls || [];
      if (audioUrls.length) {
        audioWrap.innerHTML = audioUrls.map(url => `<audio controls style="width:100%;" src="${url}"></audio>`).join("");
      } else {
        document.getElementById("task-audio-card").classList.add("hidden");
      }

      document.getElementById("task-loading").classList.add("hidden");
      document.getElementById("task-content").classList.remove("hidden");

      await loadMatchingClaim(task.id);
    } catch (err) {
      document.getElementById("task-loading").classList.add("hidden");
      document.getElementById("task-error").classList.remove("hidden");
      document.getElementById("task-error-text").textContent = err.message;
    }
  }

  // Members AND leaders can submit against a claim their own group holds —
  // a leader may also personally contribute work, not just manage others'.
  async function loadMatchingClaim(taskId) {
    const submitCard = document.getElementById("submit-card");
    if (user.role !== "member" && user.role !== "leader") { submitCard.classList.add("hidden"); return; }
    try {
      const claims = await NM.apiClaimsForMyGroup();
      const taskClaims = claims.filter(c => c.task_id === taskId);
      // I might be a leader of one group AND just a member of another — when
      // both hold a claim for the same task, always prefer the group I
      // actually LEAD, so the naming notice and upload target are correct.
      const ledGroupIds = new Set((user.ledGroups || []).map(g => g.id));
      matchingClaim = taskClaims.find(c => ledGroupIds.has(c.group_id)) || taskClaims[0] || null;
      const namingNotice = document.getElementById("naming-notice");
      if (!matchingClaim) {
        document.getElementById("submit-hint").textContent = "جروبك لسه ما استلمش كمية من المهمة دي — استنى الليدر أو الهيد ليدر يستلمها الأول.";
        document.getElementById("submit-btn").disabled = true;
        namingNotice.classList.add("hidden");
      } else {
        document.getElementById("submit-hint").textContent = `متاح لجروبك ${matchingClaim.remaining_in_claim} وحدة لسه محتاجة تسليم.`;
        document.getElementById("submit-btn").disabled = false;
        const iAmThisGroupsLeader = user.role === "leader" && matchingClaim.leader_id === user.id;
        const namingPreview = iAmThisGroupsLeader
          ? `"${user.firstName || "اسمك"} - جروب ${matchingClaim.group_number}"`
          : `"${user.firstName || "اسمك"} - ${user.whatsappNumber || "رقم واتسابك"} - ${matchingClaim.leader_id ? (matchingClaim.leader_name || "الليدر") : "بدون ليدر"}"`;
        namingNotice.textContent = `📎 ملاحظة: ملفك هيتسمى تلقائيًا بالشكل ده عشان نقدر نتعرف عليه: ${namingPreview} — مش محتاج تسميه بنفسك، النظام بيعمل ده تلقائيًا.`;
        namingNotice.classList.remove("hidden");
      }
    } catch (_) {
      submitCard.classList.add("hidden");
    }
  }

  document.getElementById("submit-file").addEventListener("change", async function () {
    const file = this.files[0];
    if (!file || !matchingClaim) return;
    const errorBox = document.getElementById("submit-error");
    const successBox = document.getElementById("submit-success");
    errorBox.style.display = "none";
    successBox.style.display = "none";
    this.disabled = true;
    const btn = document.getElementById("submit-btn");
    const originalBtnText = btn.textContent;
    btn.textContent = "⏳ جاري الرفع...";
    btn.disabled = true;
    try {
      await NM.apiUploadSubmission(matchingClaim.claim_id, file);
      successBox.textContent = "✅ اترفع شغلك بنجاح!";
      successBox.style.display = "block";
      await loadMatchingClaim(taskId);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
    } finally {
      this.disabled = false;
      this.value = "";
      btn.textContent = originalBtnText;
      btn.disabled = false;
    }
  });

  loadTask();
</script>
</body>
</html>
