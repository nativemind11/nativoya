<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أنواع المهام — Nativoya</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="container section">
  <div class="section-head">
    <h1>أنواع المهام على المنصة</h1>
    <p>كل نوع له تفاصيله الخاصة، وكل مهمة بتوصلك بفيديو شرح وسامبل صوتي والسعر قبل ما تبدأ.</p>
  </div>
  <div class="grid-3" id="services-grid"></div>
  <div class="card text-center" style="margin-top:30px;" id="services-cta-card">
    <h3 id="services-cta-title">مستعد تبدأ؟</h3>
    <p class="text-muted" id="services-cta-body">سجّل واحدة، حدد لغاتك ومهاراتك، وابدأ تشوف المهام المتاحة ليك.</p>
    <a href="signup.html" class="btn btn-primary" id="services-cta-btn">إنشاء حساب</a>
  </div>
</main>

<script src="../js/shared.js"></script>
<script>
  const grid = document.getElementById("services-grid");
  NM.SERVICES.forEach(s => {
    const a = document.createElement("a");
    a.href = `service.html?s=${s.slug}`;
    a.style.textDecoration = "none";
    a.innerHTML = `
      <div class="card">
        <div class="icon-badge" style="font-size:1.6rem;">${s.icon}</div>
        <h3 style="margin-top:10px;">${s.ar}</h3>
        <p class="text-muted" style="margin-bottom:0;">اعرف التفاصيل</p>
      </div>`;
    grid.appendChild(a);
  });

  // already have an account? point them to their dashboard instead of signup
  const loggedInUser = NM.currentUser();
  if (loggedInUser) {
    const dashboardPath = loggedInUser.role === "head_leader" ? "dashboard-admin.html"
      : loggedInUser.role === "leader" ? "dashboard-leader.html" : "dashboard-member.html";
    document.getElementById("services-cta-title").textContent = "شايف مهمة عايز تبدأها؟";
    document.getElementById("services-cta-body").textContent = "روح لوحة التحكم بتاعتك وشوف المهام المتاحة ليك دلوقتي.";
    const btn = document.getElementById("services-cta-btn");
    btn.textContent = "روح لوحة التحكم";
    btn.href = dashboardPath;
  }
</script>
</body>
</html>
