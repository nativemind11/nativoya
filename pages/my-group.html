<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جروبي — Nativoya</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="container section" id="page-main">
  <div class="section-head">
    <h1 id="group-heading">جروبي</h1>
    <p id="group-subheading" class="text-muted">—</p>
  </div>

  <div class="chat-shell card" style="padding:0; grid-template-columns: 1fr;" id="chat-shell">
    <section class="chat-main">
      <div class="chat-head" id="chat-head">—</div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="اكتب رسالتك...">
        <button class="btn btn-secondary" id="attach-btn" title="إرفاق ملف">📎</button>
        <button class="btn btn-primary" id="send-btn">إرسال</button>
      </div>
    </section>
  </div>

  <p class="text-muted text-center" style="margin-top:16px; font-size:0.85rem;">
    💬 شات حقيقي متصل بـ Firebase — الرسايل بتوصل لحظيًا لكل أعضاء جروبك.
  </p>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/shared.js"></script>
<script src="../js/chat.js"></script>
<script>
  let user = NM.currentUser();
  if (!user) { location.href = "login.html"; }
  else { init(); }

  async function init() {
    try { user = await NM.apiRefreshMe(); } catch (_) {}
    if (!user.language || !user.groupNumber) { location.href = "language-select.html"; return; }
    initMyGroup();
  }

  function initMyGroup() {
    const isLeader = user.role === "leader";
    document.getElementById("group-heading").textContent = `${user.language} — جروب #${user.groupNumber}`;
    document.getElementById("group-subheading").textContent = isLeader
      ? "انت ليدر الجروب ده — تقدر تستلم مهام وتراجع تسليمات أعضائك"
      : "الجروب الأصلي للغتك — كل رسايلك وتحديثاتك هنا";
    document.getElementById("chat-head").textContent = `${user.language} — جروب #${user.groupNumber}`;
    connectChat();
  }

  async function connectChat() {
    const wrap = document.getElementById("chat-messages");
    wrap.innerHTML = `<p class="text-muted" style="padding:16px;">جاري الاتصال بالشات...</p>`;
    try {
      await NMChat.ensureFirebaseAuth();
      NMChat.listenToGroup(user.groupId, renderMessages, (err) => {
        wrap.innerHTML = `<p class="text-muted" style="padding:16px;">تعذر تحميل الرسايل: ${err.message}</p>`;
      });
    } catch (err) {
      wrap.innerHTML = `<p class="text-muted" style="padding:16px;">تعذر الاتصال بالشات: ${err.message}</p>`;
    }
  }

  function renderMessages(messages) {
    const wrap = document.getElementById("chat-messages");
    const myUid = NMChat.currentUid();
    wrap.innerHTML = messages.length
      ? messages.map(m => `
          <div class="msg-row${m.senderId === myUid ? " mine" : ""}">
            <div class="msg-avatar">${(m.senderName || "?")[0]}</div>
            <div><div class="msg-bubble">${escapeHtml(m.text)}</div></div>
          </div>`).join("")
      : `<p class="text-muted" style="padding:16px;">لسه مفيش رسايل — ابدأ المحادثة!</p>`;
    wrap.scrollTop = wrap.scrollHeight;
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  function sendMsg() {
    const input = document.getElementById("chat-input");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    NMChat.sendMessage(user.groupId, text, user.firstName || "عضو").catch(err => alert(err.message));
  }
  document.getElementById("send-btn").addEventListener("click", sendMsg);
  document.getElementById("chat-input").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMsg(); });
  document.getElementById("attach-btn").addEventListener("click", () => {
    alert("رفع الملفات في الشات هيتفعّل قريب — لحد دلوقتي تقدر ترفع ملفات المهام من لوحة التحكم بتاعتك.");
  });
</script>
</body>
</html>
