<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جروبي — Nativoya</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="container section" id="page-main">
  <div class="section-head">
    <h1 id="group-heading">جروبي</h1>
    <p id="group-subheading" class="text-muted">—</p>
  </div>

  <div class="chat-shell card" style="padding:0; grid-template-columns: 1fr;" id="chat-shell">
    <section class="chat-main">
      <div class="chat-head" id="chat-head">—</div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="اكتب رسالتك...">
        <button class="btn btn-secondary" id="attach-btn" title="إرفاق ملف">📎</button>
        <button class="btn btn-primary" id="send-btn">إرسال</button>
      </div>
    </section>
  </div>


</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/shared.js"></script>
<script>
  const user = NM.currentUser();
  if (!user) { location.href = "login.html"; }
  else if (!user.language || !user.groupNumber) {
    location.href = "language-select.html";
  } else {
    initMyGroup();
  }

  async function initMyGroup() {
    const isLeader = user.role === "leader";
    document.getElementById("group-heading").textContent = `${user.language} — جروب #${user.groupNumber}`;
    document.getElementById("group-subheading").textContent = isLeader
      ? "انت ليدر الجروب ده — تقدر تستلم مهام وتراجع تسليمات أعضائك"
      : "الجروب الأصلي للغتك — كل رسايلك وتحديثاتك هنا";
    document.getElementById("chat-head").textContent = `${user.language} — جروب #${user.groupNumber}`;

    await NM_FIREBASE.ready; // anonymous auth must succeed before touching Firestore
    const chatId = `${user.language}_${user.groupNumber}`.replace(/[^\w\u0600-\u06FF]/g, "_");
    const messagesRef = NM_FIREBASE.db.collection("groupChats").doc(chatId).collection("messages");

    function renderMessages(snapshot) {
      const wrap = document.getElementById("chat-messages");
      wrap.innerHTML = "";
      snapshot.forEach(doc => {
        const m = doc.data();
        const mine = m.userId === user.id;
        const row = document.createElement("div");
        row.className = "msg-row" + (mine ? " mine" : "");
        row.innerHTML = `
          <div class="msg-avatar">${(m.name || "?")[0]}</div>
          <div><div class="msg-bubble">${m.text}</div></div>`;
        wrap.appendChild(row);
      });
      wrap.scrollTop = wrap.scrollHeight;
    }

    messagesRef.orderBy("createdAt", "asc").limit(200).onSnapshot(renderMessages, (err) => {
      console.error("Firestore chat error:", err);
    });

    function sendMsg() {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text) return;
      messagesRef.add({
        text,
        name: user.firstName || "أنا",
        userId: user.id,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      input.value = "";
    }
    document.getElementById("send-btn").addEventListener("click", sendMsg);
    document.getElementById("chat-input").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMsg(); });
    document.getElementById("attach-btn").addEventListener("click", () => {
      alert("رفع الملفات والصور هيتفعّل بعد ترقية Firebase Storage.");
    });
  }
</script>
</body>
</html>
