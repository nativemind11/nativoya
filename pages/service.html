<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">مهارة — Nativoya</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="container section" style="max-width:640px;">
  <span class="pill" id="service-icon-pill">🧩 مهارة</span>
  <h1 id="service-title" style="margin-top:14px;">—</h1>
  <p id="service-desc" style="font-size:1.05rem;">—</p>

  <h3 style="margin-top:30px;">أمثلة على المهام</h3>
  <div id="service-examples" style="display:grid; gap:12px;"></div>

  <h3 style="margin-top:30px;">إيه اللي هتاخده</h3>
  <div id="service-benefits" style="display:grid; gap:14px;"></div>

  <div class="card text-center" style="margin-top:30px;">
    <h3>سجّل وابدأ الشغل</h3>
    <p class="text-muted">هتحدد لغاتك والمهارات اللي تقدمها (من ضمنها المهارة دي) وقت التسجيل.</p>
    <a href="signup.html" class="btn btn-primary btn-block">إنشاء حساب</a>
  </div>
</main>

<script src="../js/shared.js"></script>
<script>
  const SERVICE_DETAILS = {
    "voice_recording": {
      examples: ["تسجيل جمل قصيرة بلهجات مختلفة", "تسجيل ردود صوتية طبيعية لمحادثات قصيرة"],
      benefits: ["مهام قصيرة تناسب الوقت الفاضي", "مايحتاجش خبرة سابقة", "دفع بعد المراجعة والموافقة مباشرة"],
    },
    "transcription": {
      examples: ["تفريغ تسجيل صوتي مدته دقايق لنص مكتوب", "تفريغ مكالمة قصيرة بلهجة معينة"],
      benefits: ["مهام قصيرة تناسب الوقت الفاضي", "تدريب بسيط قبل أول مهمة", "دفع سريع بعد المراجعة"],
    },
    "data_annotation": {
      examples: ["توسيم نصوص حسب المشاعر أو النية", "تصنيف ردود شات بوت صح/غلط"],
      benefits: ["مهام بسيطة ومنظمة بخطوات واضحة", "تناسب المبتدئين تمامًا", "دفع سريع بعد المراجعة"],
    },
    "translation": {
      examples: ["ترجمة جمل قصيرة بين لغتين", "ترجمة محادثات نموذجية لأغراض تدريب نموذج"],
      benefits: ["مهام مدفوعة تُنشر بانتظام من الهيد ليدر", "شهادة إتمام لكل مهمة تخلصها", "عمل عن بُعد بالكامل"],
    },
    "subtitling": {
      examples: ["ترجمة وتوقيت مقاطع فيديو قصيرة", "مراجعة ترجمة موجودة والتأكد من دقتها"],
      benefits: ["عمل إبداعي ومتنوع", "مهارة مطلوبة باستمرار", "شهادات إتمام لكل مشروع"],
    },
    "dubbing": {
      examples: ["دبلجة مقطع صوتي قصير", "تسجيل صوت لمحتوى تدريبي"],
      benefits: ["فرصة لاستغلال موهبتك الصوتية", "شارة \"صوت موثّق\" بعد مراجعة عينة صوتية", "مهام متنوعة"],
    },
    "conversational_data": {
      examples: ["كتابة أو تقييم حوارات نموذجية", "ترتيب ردود شات بوت من الأفضل للأسوأ"],
      benefits: ["مهام تناسب اللي بيحبوا الكتابة", "مايحتاجش معدات خاصة", "دفع سريع بعد المراجعة"],
    },
    "copywriting_nlp": {
      examples: ["كتابة أمثلة نصية لتدريب نموذج", "مراجعة وتحسين نصوص مولّدة بالذكاء الاصطناعي"],
      benefits: ["مهام تناسب أصحاب الخلفية اللغوية القوية", "عمل عن بُعد بالكامل", "شهادات إتمام لكل مشروع"],
    },
  };

  const params = new URLSearchParams(location.search);
  const slug = params.get("s") || NM.SERVICES[0].slug;
  const svc = NM.SERVICES.find(s => s.slug === slug) || NM.SERVICES[0];
  const details = SERVICE_DETAILS[svc.slug] || { examples: [], benefits: [] };

  document.getElementById("page-title").textContent = `${svc.ar} — Nativoya`;
  document.getElementById("service-icon-pill").textContent = `${svc.icon} ${svc.ar}`;
  document.getElementById("service-title").textContent = svc.ar;
  document.getElementById("service-desc").textContent =
    `سجّل واختار "${svc.ar}" ضمن مهاراتك، عشان تستلم مهام حقيقية من فريق Nativoya أول بأول.`;

  const exWrap = document.getElementById("service-examples");
  details.examples.forEach(ex => {
    exWrap.innerHTML += `<div class="card card-compact"><p class="mb-0">${ex}</p></div>`;
  });

  const beWrap = document.getElementById("service-benefits");
  details.benefits.forEach(b => {
    beWrap.innerHTML += `
      <div class="feature-item">
        <div class="icon">✓</div>
        <p class="mb-0">${b}</p>
      </div>`;
  });
</script>
</body>
</html>
