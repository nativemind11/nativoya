<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب — Nativoya</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="container section" style="max-width:560px;">
  <div class="card">
    <h1 class="text-center" style="font-size:1.6rem;" data-i18n="signup_title">إنشاء حساب جديد</h1>
    <p class="text-center" data-i18n="signup_subtitle">ثواني وتبقى جزء من مجتمع Nativoya</p>

    <div id="invite-banner" class="hidden card card-compact" style="background:var(--color-pill-bg); border:none; margin-bottom:20px;">
      <p class="mb-0" style="color:var(--color-pill-text); font-weight:700;" id="invite-banner-text"></p>
    </div>

    <form id="signup-form">
      <div class="field">
        <label for="s-name" data-i18n="label_name">الاسم بالكامل</label>
        <input type="text" id="s-name" required>
      </div>
      <div class="field">
        <label for="s-email" data-i18n="label_email">البريد الإلكتروني</label>
        <input type="email" id="s-email" required>
      </div>
      <div class="field">
        <label for="s-password" data-i18n="label_password">كلمة المرور</label>
        <input type="password" id="s-password" required minlength="6">
        <div class="hint" data-i18n="hint_password">6 أحرف على الأقل</div>
      </div>
      <div class="field">
        <label for="s-whatsapp" data-i18n="label_whatsapp">رقم واتساب</label>
        <input type="tel" id="s-whatsapp" required>
      </div>
      <div class="field">
        <label for="s-country" data-i18n="label_country">الدولة</label>
        <select id="s-country" required></select>
      </div>
      <div class="field">
        <label data-i18n="label_gender">النوع</label>
        <div class="radio-card-group">
          <label class="radio-card">
            <input type="radio" name="s-gender" value="male" required>
            <div><strong data-i18n="gender_male">ذكر</strong></div>
          </label>
          <label class="radio-card">
            <input type="radio" name="s-gender" value="female" required>
            <div><strong data-i18n="gender_female">أنثى</strong></div>
          </label>
        </div>
      </div>
      <div class="field">
        <label for="s-payout" data-i18n="label_payout">رقم/حساب استلام التحويلات</label>
        <input type="text" id="s-payout" data-i18n-placeholder="placeholder_payout" placeholder="رقم فودافون كاش / إنستاباي أو إيميل PayPal" required>
        <div class="hint" data-i18n="hint_payout">ده اللي هيتحول عليه مستحقاتك من المهام.</div>
      </div>

      <hr style="border:none; border-top:1px solid var(--color-border, #e5e7f5); margin:24px 0;">

      <div class="field">
        <label><span data-i18n="label_languages">اللغات واللهجات اللي بتتكلمها</span> <span style="color:var(--color-primary-blue);">*</span></label>
        <div class="hint" style="margin-bottom:10px;" data-i18n="hint_languages">هتنضم تلقائيًا لجروب كل لغة تختارها — تقدر تختار أكتر من واحدة.</div>
        <div id="languages-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:8px; max-height:260px; overflow-y:auto; padding-inline-end:4px;"></div>
      </div>

      <hr style="border:none; border-top:1px solid var(--color-border, #e5e7f5); margin:24px 0;">

      <div class="field">
        <label><span data-i18n="label_skills">المهارات اللي تقدر تقدمها</span> <span style="color:var(--color-primary-blue);">*</span></label>
        <div class="hint" style="margin-bottom:10px;" data-i18n="hint_skills">اختار كل اللي ينطبق عليك.</div>
        <div id="skills-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:8px;"></div>
      </div>

      <p id="signup-error" class="hint" style="color:#e0245e; display:none; margin-top:16px;"></p>
      <button type="submit" class="btn btn-primary btn-block" id="signup-submit" style="margin-top:20px;" data-i18n="btn_create_account">إنشاء الحساب</button>
    </form>
    <p class="text-center" style="margin-top:16px;">
      <span data-i18n="already_have_account">عندك حساب بالفعل؟</span> <a href="login.html" data-i18n="login_link">سجّل دخول</a>
    </p>
  </div>
</main>

<script src="../js/shared.js"></script>
<script>
  const countrySelect = document.getElementById("s-country");
  const langGrid = document.getElementById("languages-grid");
  const skillsGrid = document.getElementById("skills-grid");

  // Country/language/skill names live in two languages, but the VALUE saved
  // to checkboxes/inputs never changes with the UI language — only the
  // visible label does. Re-rendering on language change keeps everything in
  // sync without losing whatever the user already picked.
  function renderCountries() {
    const isEn = NM.getLang() === "en";
    const previousValue = countrySelect.value;
    countrySelect.innerHTML = `<option value="">${NM.t("placeholder_select_country")}</option>`;
    NM.COUNTRIES.forEach((c, i) => {
      const opt = document.createElement("option");
      opt.value = c; // canonical value stays Arabic — this is what's saved to the DB
      opt.textContent = isEn ? NM.COUNTRIES_EN[i] : c;
      countrySelect.appendChild(opt);
    });
    if (previousValue) countrySelect.value = previousValue;
  }

  function renderLanguages() {
    const isEn = NM.getLang() === "en";
    const checked = new Set(Array.from(document.querySelectorAll('input[name="lang"]:checked')).map(i => i.value));
    langGrid.innerHTML = "";
    NM.LANGUAGES.forEach((l, i) => {
      const label = document.createElement("label");
      label.className = "radio-card";
      label.innerHTML = `
        <input type="checkbox" name="lang" value="${l.name}" id="lang-${i}" ${checked.has(l.name) ? "checked" : ""}>
        <div><strong>${isEn ? l.en : l.name}</strong></div>`;
      langGrid.appendChild(label);
    });
  }

  function renderSkills() {
    const isEn = NM.getLang() === "en";
    const checked = new Set(Array.from(document.querySelectorAll('input[name="skill"]:checked')).map(i => i.value));
    skillsGrid.innerHTML = "";
    NM.SKILLS.forEach((s, i) => {
      const label = document.createElement("label");
      label.className = "radio-card";
      label.innerHTML = `
        <input type="checkbox" name="skill" value="${s.slug}" id="skill-${i}" ${checked.has(s.slug) ? "checked" : ""}>
        <div><strong>${s.icon} ${isEn ? s.en : s.ar}</strong></div>`;
      skillsGrid.appendChild(label);
    });
  }

  function renderDynamicText() {
    if (invite) {
      document.getElementById("invite-banner-text").textContent =
        "🎉 " + NM.t("invite_join_note")
          .replace("{language}", invite.language)
          .replace("{groupNumber}", invite.groupNumber);
    }
  }

  renderCountries();
  renderLanguages();
  renderSkills();

  // re-render whenever AR/EN is toggled (the header's language switch fires
  // this event after it updates every [data-i18n] element on the page)
  document.addEventListener("nm:langchange", () => {
    renderCountries();
    renderLanguages();
    renderSkills();
    renderDynamicText();
  });

  // invite link flow: pre-select the invited language and hide the picker
  // (they'll join that specific leader's group right after account creation)
  const params = new URLSearchParams(location.search);
  const invite = NM.resolveInviteCode(params.get("invite"));
  if (invite) {
    document.getElementById("invite-banner").classList.remove("hidden");
    renderDynamicText();
  }

  document.getElementById("signup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("signup-error");
    const submitBtn = document.getElementById("signup-submit");
    errorBox.style.display = "none";

    const languages = Array.from(document.querySelectorAll('input[name="lang"]:checked')).map(i => i.value);
    const skills = Array.from(document.querySelectorAll('input[name="skill"]:checked')).map(i => i.value);
    const genderInput = document.querySelector('input[name="s-gender"]:checked');

    if (!genderInput) {
      errorBox.textContent = NM.t("error_select_gender");
      errorBox.style.display = "block";
      return;
    }
    if (!invite && languages.length === 0) {
      errorBox.textContent = NM.t("error_select_language");
      errorBox.style.display = "block";
      return;
    }
    if (skills.length === 0) {
      errorBox.textContent = NM.t("error_select_skill");
      errorBox.style.display = "block";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = NM.t("btn_creating_account");

    try {
      await NM.apiSignup({
        firstName: document.getElementById("s-name").value,
        email: document.getElementById("s-email").value,
        password: document.getElementById("s-password").value,
        whatsappNumber: document.getElementById("s-whatsapp").value,
        country: document.getElementById("s-country").value,
        gender: genderInput.value,
        payoutIdentifier: document.getElementById("s-payout").value,
        languages,
        skills,
      });

      if (invite) {
        // joining an existing leader's group directly — not the language's default group
        await NM.apiJoinGroup(invite.language, invite.groupNumber);
      }
      location.href = "dashboard-member.html";
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = NM.t("btn_create_account");
    }
  });
</script>
</body>
</html>
